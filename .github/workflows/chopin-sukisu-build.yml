
name: Chopin SukiSU Ultra builtin 4.14 Build

on:
  workflow_dispatch:
  push:
    branches: [chopin-sukisu]
    paths:
      - .github/workflows/chopin-sukisu-build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl \
            device-tree-compiler flex git libelf-dev \
            libncurses-dev libssl-dev lz4 make python3 tar

      - name: Download Android Clang
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clang"
          curl -fLsS --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2021/clang-r383902.tar.gz" \
            -o "$RUNNER_TEMP/clang.tar.gz"
          tar -xzf "$RUNNER_TEMP/clang.tar.gz" -C "$RUNNER_TEMP/clang"
          echo "$RUNNER_TEMP/clang/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/clang/lib64" >> "$GITHUB_ENV"

      - name: Download and validate candidate Android GCC 4.9
        run: |
          set -euo pipefail
          base=https://android.googlesource.com/platform/prebuilts/gcc/linux-x86
          tag=android-9.0.0_r1

          for toolchain in \
            aarch64/aarch64-linux-android-4.9 \
            arm/arm-linux-androideabi-4.9; do

            dest="$RUNNER_TEMP/${toolchain##*/}"
            mkdir -p "$dest"

            echo "=== $toolchain at $tag ==="

            curl -fLsS --retry 3 \
              "$base/$toolchain/+archive/refs/tags/$tag.tar.gz" \
              -o "$dest/toolchain.tar.gz"

            tar -xzf "$dest/toolchain.tar.gz" -C "$dest"

            compiler="$dest/bin/${toolchain##*/}"
            compiler="${compiler%-4.9}-gcc"

            if [[ ! -x "$compiler" ]]; then
              echo "::error::Missing executable $compiler"
              exit 1
            fi

            prefix="${compiler%gcc}"

            "$compiler" --version
            target=$("$compiler" -dumpmachine)

            echo "Compiler target: $target"

            case "$toolchain:$target" in
              aarch64/*:aarch64-*)
                test -x "${prefix}elfedit" || {
                  echo "::error::Missing elfedit"
                  exit 1
                }
                echo "CROSS_COMPILE=$prefix" >> "$GITHUB_ENV"
                ;;
              arm/*:arm-*)
                echo "CROSS_COMPILE_ARM32=$prefix" >> "$GITHUB_ENV"
                ;;
              *)
                echo "::error::Unexpected compiler target $target"
                exit 1
                ;;
            esac

            dirname "$compiler" >> "$GITHUB_PATH"
          done

      - name: Verify Clang and LLD
        run: |
          set -euo pipefail
          clang --version
          ld.lld --version

      - name: Clone pinned stock source
        run: |
          set -euo pipefail

          git init kernel

          git -C kernel remote add origin \
            https://github.com/ChopinKernels/android_kernel_chopin_android_T.git

          git -C kernel fetch --depth=1 origin \
            0647a49c9557faa92b90c4ae188587787226be9e

          git -C kernel checkout --detach FETCH_HEAD

          git -C kernel rev-parse HEAD

          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' kernel/Makefile

      - name: Integrate pinned SukiSU Ultra
        working-directory: kernel
        run: |
          set -euo pipefail

          # Download pinned SukiSU Ultra.
          git init KernelSU

          git -C KernelSU fetch \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git \
            de9bc7e6b46181f8b27ac7b96db946420838dd18

          git -C KernelSU checkout --detach FETCH_HEAD

          # Verify upstream header.
          echo '4e74a6beccf82890c691ff79ad7fac5156e7c164b51ff46f87986f8f0459eeb2  KernelSU/kernel/kernel_includes.h' | sha256sum -c -

          test -f include/linux/static_key.h

          sed -i \
            's@#include <linux/static_call.h>@#include <linux/static_key.h>@' \
            KernelSU/kernel/kernel_includes.h

          # Apply Linux 4.14 compatibility modifications.
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)

              if count != expected:
                  raise SystemExit(
                      f"ERROR: {path}: expected {expected} matches, found {count}"
                  )

              p.write_text(text.replace(old, new, expected))
              print(f"PATCH OK: {path}")

          # 1. Disable CPU spoof source inclusion.
          replace_once(
              "KernelSU/kernel/ksu_main.c",
              '#include "extension/cpu_spoof.c"\n',
              '/* CPU spoof disabled for Chopin 4.14. */\n'
          )

          # 2. Remove CPU spoof extension registration structure.
          replace_once(
              "KernelSU/kernel/extension/extension.c",
              '''    static const struct ksu_extension_handler cpu_spoof_handler = {
                  .extension_id = KSU_EXTENSION_CPU_SPOOF,
                  .name = "cpu_spoof",
                  /* State lives in each ioctl payload; nothing to toggle or keep. */
                  .caps = 0,
                  .ops = NULL,
                  .io_handler = ksu_extension_cpu_spoof_io,
              };
          ''',
              ''
          )

          # 3. Remove CPU spoof manager registration.
          replace_once(
              "KernelSU/kernel/extension/extension.c",
              '''    if (ksu_register_extension_handler(&cpu_spoof_handler))
                  pr_err("extension: failed to register cpu_spoof\\n");
          ''',
              ''
          )

          # 4. Avoid duplicate KSU_NO_PREINIT definition.
          replace_once(
              "KernelSU/kernel/preinit/common/preinit.h",
              '''#if !defined(CONFIG_ARM64) || !defined(KSU_CAN_USE_JUMP_LABEL)
          #define KSU_NO_PREINIT
          #endif
          ''',
              '''#if !defined(CONFIG_ARM64) || !defined(KSU_CAN_USE_JUMP_LABEL)
          #ifndef KSU_NO_PREINIT
          #define KSU_NO_PREINIT
          #endif
          #endif
          '''
          )

          # 5. Linux 4.14 access_ok compatibility.
          replace_once(
              "KernelSU/kernel/extension/kpm/kpm.c",
              'access_ok(u64_to_user_ptr(cmd.result_code), sizeof(result))',
              'access_ok(VERIFY_WRITE, u64_to_user_ptr(cmd.result_code), sizeof(result))'
          )

          # 6. Replace kvcalloc with kcalloc.
          replace_once(
              "KernelSU/kernel/supercall/dispatch.c",
              '''names = kvcalloc(cmd.count, sizeof(*names), GFP_KERNEL);
          addrs = kvcalloc(cmd.count, sizeof(*addrs), GFP_KERNEL);''',
              '''names = kcalloc(cmd.count, sizeof(*names), GFP_KERNEL);
          addrs = kcalloc(cmd.count, sizeof(*addrs), GFP_KERNEL);'''
          )

          print("All source modifications completed.")
          PY

          # Verify modifications.
          grep -n 'CPU spoof disabled' KernelSU/kernel/ksu_main.c

          grep -n 'access_ok(VERIFY_WRITE' \
            KernelSU/kernel/extension/kpm/kpm.c

          grep -n 'names = kcalloc' \
            KernelSU/kernel/supercall/dispatch.c

          grep -n 'addrs = kcalloc' \
            KernelSU/kernel/supercall/dispatch.c

          if grep -n 'cpu_spoof_handler' \
            KernelSU/kernel/extension/extension.c; then
            echo "::error::CPU spoof registration still exists"
            exit 1
          fi

          # Verify source changes.
          git -C KernelSU diff --check
          git -C KernelSU diff --stat

          # Connect KernelSU to the stock kernel.
          ln -s ../KernelSU/kernel drivers/kernelsu

          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

          printf '\nsource "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig

          echo "SukiSU integration completed."

      - name: Apply pinned chopin manual hooks
        working-directory: kernel
        run: |
          set -euo pipefail

          # Verify original source files.
          echo '9e0a0f61fde132dd1bbcdde36185904455a7a3e752ed0021b093af896cf4a76f  fs/exec.c' | sha256sum -c -

          echo '86c5f1065a816d0ad8ba85c76a535311aaff420c056c653db524d7dfd18a4e92  fs/open.c' | sha256sum -c -

          echo '331e95876a74f8f440462bfa3a9d5025a7b320127b9a60606bf5873f615adc36  fs/read_write.c' | sha256sum -c -

          echo '12170d9b3de439759f5e8772bb87a076d6548b947231344f2cbb1de358af28dd  fs/stat.c' | sha256sum -c -

          echo 'aa13476b66767f117fb5fbbd3cf6a35358f7252fa5bd146f87a07efefa3da9e9  kernel/reboot.c' | sha256sum -c -

          cat > /tmp/chopin-sukisu-hooks.patch <<'CHOPIN_PATCH'
          --- a/fs/exec.c
          +++ b/fs/exec.c
          @@ -1710,6 +1710,11 @@
           	if (IS_ERR(filename))
           		return PTR_ERR(filename);

          +#ifdef CONFIG_KSU
          +	extern int ksu_handle_execveat(int *, struct filename **, void *, void *, int *);
          +	ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
          +#endif
          +
           	/*
           	 * We move the actual failure in case of RLIMIT_NPROC excess from
           	 * set*uid() to execve() because too many poorly written programs
          --- a/fs/open.c
          +++ b/fs/open.c
          @@ -369,6 +369,11 @@
           	int res;
           	unsigned int lookup_flags = LOOKUP_FOLLOW;

          +#ifdef CONFIG_KSU
          +	extern int ksu_handle_faccessat(int *, const char __user **, int *, int *);
          +	ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          +#endif
          +
           	if (mode & ~S_IRWXO)
           		return -EINVAL;
          --- a/fs/read_write.c
          +++ b/fs/read_write.c
          @@ -573,6 +573,13 @@
           	struct fd f = fdget_pos(fd);
           	ssize_t ret = -EBADF;

          +#ifdef CONFIG_KSU
          +	extern bool ksu_vfs_read_hook;
          +	extern int ksu_handle_sys_read(unsigned int, char __user **, size_t *);
          +	if (unlikely(ksu_vfs_read_hook))
          +		ksu_handle_sys_read(fd, &buf, &count);
          +#endif
          +
           	if (f.file) {
           		loff_t pos = file_pos_read(f.file);
           		ret = vfs_read(f.file, buf, count, &pos);
          --- a/fs/stat.c
          +++ b/fs/stat.c
          @@ -144,6 +144,12 @@
           				    request_mask, query_flags);
           		fdput(f);
           	}
          +#ifdef CONFIG_KSU
          +	extern void ksu_handle_vfs_fstat(int, loff_t *);
          +	if (!error)
          +		ksu_handle_vfs_fstat(fd, &stat->size);
          +#endif
          +
           	return error;
           }
           EXPORT_SYMBOL(vfs_statx_fd);
          @@ -169,6 +175,11 @@
           	struct path path;
           	int error = -EINVAL;
           	unsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;
          +
          +#ifdef CONFIG_KSU
          +	extern int ksu_handle_stat(int *, const char __user **, int *);
          +	ksu_handle_stat(&dfd, &filename, &flags);
          +#endif

           	if ((flags & ~(AT_SYMLINK_NOFOLLOW | AT_NO_AUTOMOUNT |
           		       AT_EMPTY_PATH | KSTAT_QUERY_FLAGS)) != 0)
          --- a/kernel/reboot.c
          +++ b/kernel/reboot.c
          @@ -290,6 +290,11 @@
           	struct pid_namespace *pid_ns = task_active_pid_ns(current);
           	char buffer[256];
           	int ret = 0;
          +
          +#ifdef CONFIG_KSU
          +	extern int ksu_handle_sys_reboot(int, int, unsigned int, void __user **);
          +	ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
          +#endif

           	/* We only trust the superuser with the ability to reboot. */
           	if (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))
          CHOPIN_PATCH

          git apply --check /tmp/chopin-sukisu-hooks.patch
          git apply /tmp/chopin-sukisu-hooks.patch

          git diff --check

          git diff > manual-hooks-applied.patch

      - name: Configure and compile SukiSU Ultra kernel
        working-directory: kernel
        run: |
          set -euo pipefail

          args=(
            ARCH=arm64
            HOSTCC=gcc HOSTCXX=g++
            CC=clang LD=ld.lld
            AR=llvm-ar NM=llvm-nm
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE="$CROSS_COMPILE"
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32"
          )

          # Configure kernel.
          make O=out "${args[@]}" chopin_user_defconfig 2>&1 | tee build.log

          test -s out/.config

          scripts/config --file out/.config \
            --set-str LOCALVERSION "-SukiSU" \
            --enable OVERLAY_FS \
            --enable KSU \
            --enable EXT4_FS \
            --disable KSU_SUSFS \
            --disable KPM \
            --disable KSU_FEATURE_ADBROOT

          make O=out "${args[@]}" olddefconfig 2>&1 | tee -a build.log

          # Verify configuration.
          for option in OVERLAY_FS EXT4_FS KSU; do
            grep -x "CONFIG_${option}=y" out/.config | tee -a build.log
          done

          for option in KSU_SUSFS KPM KSU_FEATURE_ADBROOT; do
            grep -x "# CONFIG_${option} is not set" out/.config | tee -a build.log
          done

          # Generate compile.h.
          make O=out "${args[@]}" init/version.o 2>&1 | tee -a build.log

          test -s out/include/generated/compile.h

          # Build SELinux.
          make -j"$(nproc)" O=out "${args[@]}" security/selinux/ 2>&1 | tee -a build.log

          test -s out/security/selinux/flask.h
          test -s out/security/selinux/av_permissions.h

          # Build SukiSU.
          make -j"$(nproc)" O=out "${args[@]}" drivers/kernelsu/ 2>&1 | tee -a build.log

          # Build manual hooks.
          make -j"$(nproc)" O=out "${args[@]}" \
            fs/exec.o fs/open.o fs/stat.o fs/read_write.o kernel/reboot.o \
            2>&1 | tee -a build.log

          # Full kernel build.
          make -j"$(nproc)" O=out "${args[@]}" Image.gz-dtb 2>&1 | tee -a build.log

          # Verify KernelSU symbol.
          awk '$3 == "kernelsu_init" { found=1; print } END { exit !found }' \
            out/System.map | tee -a build.log

          # Verify output.
          image=out/arch/arm64/boot/Image.gz-dtb

          test -s "$image"

          ls -lh "$image" | tee -a build.log
          sha256sum "$image" | tee -a build.log

      - name: Upload verified SukiSU Ultra kernel image
        uses: actions/upload-artifact@v4
        with:
          name: chopin-sukisu-kernel-image
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error

      - name: Upload SukiSU Ultra kernel logs and configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chopin-sukisu-build-evidence
          path: |
            kernel/manual-hooks-applied.patch
            kernel/build.log
            kernel/out/.config
            kernel/out/System.map
          include-hidden-files: true
          if-no-files-found: warn
