
name: Chopin SukiSU Ultra Builtin 4.14 Build

on:
  workflow_dispatch:
  push:
    branches:
      - chopin-sukisu
    paths:
      - .github/workflows/chopin-sukisu-build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    steps:

      # ==========================================
      # 1. Install dependencies
      # ==========================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc bison build-essential ccache curl \
            device-tree-compiler flex git libelf-dev \
            libncurses-dev libssl-dev lz4 make \
            python3 rsync tar

      # ==========================================
      # 2. Download Android Clang 11
      # ==========================================

      - name: Download Android Clang
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/clang"

          curl -fLsS --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2021/clang-r383902.tar.gz" \
            -o "$RUNNER_TEMP/clang.tar.gz"

          tar -xzf "$RUNNER_TEMP/clang.tar.gz" \
            -C "$RUNNER_TEMP/clang"

          echo "$RUNNER_TEMP/clang/bin" >> "$GITHUB_PATH"

          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/clang/lib64" \
            >> "$GITHUB_ENV"

      # ==========================================
      # 3. Download Android GCC 4.9
      # ==========================================

      - name: Download Android GCC 4.9
        run: |
          set -euo pipefail

          base=https://android.googlesource.com/platform/prebuilts/gcc/linux-x86
          tag=android-9.0.0_r1

          for toolchain in \
            aarch64/aarch64-linux-android-4.9 \
            arm/arm-linux-androideabi-4.9; do

            dest="$RUNNER_TEMP/${toolchain##*/}"

            mkdir -p "$dest"

            curl -fLsS --retry 3 \
              "$base/$toolchain/+archive/refs/tags/$tag.tar.gz" \
              -o "$dest/toolchain.tar.gz"

            tar -xzf "$dest/toolchain.tar.gz" \
              -C "$dest"

            compiler="$dest/bin/${toolchain##*/}"

            compiler="${compiler%-4.9}-gcc"

            test -x "$compiler"

            prefix="${compiler%gcc}"

            "$compiler" --version

            target=$("$compiler" -dumpmachine)

            case "$toolchain:$target" in

              aarch64/*:aarch64-*)
                test -x "${prefix}elfedit"

                echo "CROSS_COMPILE=$prefix" \
                  >> "$GITHUB_ENV"
                ;;

              arm/*:arm-*)
                echo "CROSS_COMPILE_ARM32=$prefix" \
                  >> "$GITHUB_ENV"
                ;;

              *)
                echo "::error::Unexpected compiler target: $target"
                exit 1
                ;;
            esac

            dirname "$compiler" >> "$GITHUB_PATH"

          done

      # ==========================================
      # 4. Verify toolchains
      # ==========================================

      - name: Verify toolchains
        run: |
          set -euo pipefail

          clang --version

          ld.lld --version

          aarch64-linux-android-gcc --version

          arm-linux-androideabi-gcc --version

      # ==========================================
      # 5. Download Chopin kernel source
      # ==========================================

      - name: Clone pinned stock source
        run: |
          set -euo pipefail

          git init kernel

          git -C kernel remote add origin \
            https://github.com/ChopinKernels/android_kernel_chopin_android_T.git

          git -C kernel fetch --depth=1 origin \
            0647a49c9557faa92b90c4ae188587787226be9e

          git -C kernel checkout --detach FETCH_HEAD

          echo "=== Kernel commit ==="

          git -C kernel rev-parse HEAD

          echo "=== Kernel version ==="

          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' \
            kernel/Makefile

          test -f kernel/arch/arm64/configs/chopin_user_defconfig

      # ==========================================
      # 6. Integrate SukiSU Ultra
      # ==========================================

      - name: Integrate pinned SukiSU Ultra
        working-directory: kernel
        run: |
          set -euo pipefail

          git init KernelSU

          git -C KernelSU fetch --depth=1 \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git \
            de9bc7e6b46181f8b27ac7b96db946420838dd18

          git -C KernelSU checkout --detach FETCH_HEAD

          echo '4e74a6beccf82890c691ff79ad7fac5156e7c164b51ff46f87986f8f0459eeb2  KernelSU/kernel/kernel_includes.h' \
            | sha256sum -c -

          # Linux 4.14 does not provide static_call.h.
          test -f include/linux/static_key.h

          sed -i \
            's@#include <linux/static_call.h>@#include <linux/static_key.h>@' \
            KernelSU/kernel/kernel_includes.h

          # Apply compatibility modifications.
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)

              source = p.read_text()

              count = source.count(old)

              if count != 1:
                  raise SystemExit(
                      f"ERROR: {path}: expected 1 match, found {count}"
                  )

              p.write_text(source.replace(old, new, 1))

              print(f"PATCH OK: {path}")

          # 1. Disable CPU spoof implementation.
          replace_once(
              "KernelSU/kernel/ksu_main.c",
              '#include "extension/cpu_spoof.c"\n',
              '/* CPU spoof disabled for Chopin 4.14. */\n'
          )

          # 2. Remove CPU spoof handler.
          replace_once(
              "KernelSU/kernel/extension/extension.c",
              '''    static const struct ksu_extension_handler cpu_spoof_handler = {
                  .extension_id = KSU_EXTENSION_CPU_SPOOF,
                  .name = "cpu_spoof",
                  /* State lives in each ioctl payload; nothing to toggle or keep. */
                  .caps = 0,
                  .ops = NULL,
                  .io_handler = ksu_extension_cpu_spoof_io,
              };
          ''',
              ''
          )

          # 3. Remove CPU spoof registration.
          replace_once(
              "KernelSU/kernel/extension/extension.c",
              '''    if (ksu_register_extension_handler(&cpu_spoof_handler))
                  pr_err("extension: failed to register cpu_spoof\\n");
          ''',
              ''
          )

          # 4. Protect KSU_NO_PREINIT definition.
          replace_once(
              "KernelSU/kernel/preinit/common/preinit.h",
              '''#if !defined(CONFIG_ARM64) || !defined(KSU_CAN_USE_JUMP_LABEL)
          #define KSU_NO_PREINIT
          #endif
          ''',
              '''#if !defined(CONFIG_ARM64) || !defined(KSU_CAN_USE_JUMP_LABEL)
          #ifndef KSU_NO_PREINIT
          #define KSU_NO_PREINIT
          #endif
          #endif
          '''
          )

          # 5. Linux 4.14 access_ok compatibility.
          replace_once(
              "KernelSU/kernel/extension/kpm/kpm.c",
              'access_ok(u64_to_user_ptr(cmd.result_code), sizeof(result))',
              'access_ok(VERIFY_WRITE, u64_to_user_ptr(cmd.result_code), sizeof(result))'
          )

          # 6. Linux 4.14 kvcalloc compatibility.
          # Use kvmalloc_array with GFP_ZERO semantics.
          dispatch = Path(
              "KernelSU/kernel/supercall/dispatch.c"
          )

          source = dispatch.read_text()

          pattern = re.compile(
              r"(?m)^"
              r"(?P<indent>[ \t]*)"
              r"(?P<name>names|addrs) = "
              r"kvcalloc\(cmd\.count, sizeof\(\*(?P=name)\), GFP_KERNEL\);$"
          )

          def replace_alloc(match):
              name = match.group("name")

              return (
                  match.group("indent")
                  + f"{name} = kvmalloc_array("
                  + f"cmd.count, sizeof(*{name}), "
                  + "GFP_KERNEL | __GFP_ZERO);"
              )

          source, count = pattern.subn(
              replace_alloc,
              source
          )

          if count != 2:
              raise SystemExit(
                  "ERROR: dispatch.c: expected 2 kvcalloc calls, "
                  f"replaced {count}"
              )

          dispatch.write_text(source)

          print("PATCH OK: dispatch.c")

          print("All SukiSU compatibility patches completed.")

          PY

          # Verify all modifications.

          grep -n 'CPU spoof disabled' \
            KernelSU/kernel/ksu_main.c

          grep -n 'access_ok(VERIFY_WRITE' \
            KernelSU/kernel/extension/kpm/kpm.c

          grep -n 'kvmalloc_array(cmd.count' \
            KernelSU/kernel/supercall/dispatch.c

          if grep -n 'kvcalloc(' \
            KernelSU/kernel/supercall/dispatch.c; then
            echo "::error::kvcalloc remains"
            exit 1
          fi

          if grep -n 'cpu_spoof_handler' \
            KernelSU/kernel/extension/extension.c; then
            echo "::error::CPU spoof registration remains"
            exit 1
          fi

          if grep -n 'static_call.h' \
            KernelSU/kernel/kernel_includes.h; then
            echo "::error::static_call.h remains"
            exit 1
          fi

          git -C KernelSU diff --check

          git -C KernelSU diff --stat

          # Connect SukiSU to the kernel.
          ln -s ../KernelSU/kernel drivers/kernelsu

          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' \
            >> drivers/Makefile

          printf '\nsource "drivers/kernelsu/Kconfig"\n' \
            >> drivers/Kconfig

          echo "SukiSU integration completed."

      # ==========================================
      # 7. Apply manual hooks
      # ==========================================

      - name: Apply Chopin manual hooks
        working-directory: kernel
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)

              source = p.read_text()

              count = source.count(old)

              if count != 1:
                  raise SystemExit(
                      f"ERROR: {path}: expected 1 match, found {count}"
                  )

              p.write_text(source.replace(old, new, 1))

              print(f"HOOK OK: {path}")

          # ----------------------------------------
          # 1. execveat
          # ----------------------------------------

          replace_once(
              "fs/exec.c",
              "\tif (IS_ERR(filename))\n"
              "\t\treturn PTR_ERR(filename);\n\n",

              "\tif (IS_ERR(filename))\n"
              "\t\treturn PTR_ERR(filename);\n\n"
              "#ifdef CONFIG_KSU\n"
              "\textern int ksu_handle_execveat(int *, struct filename **, void *, void *, int *);\n"
              "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
              "#endif\n\n"
          )

          # ----------------------------------------
          # 2. faccessat
          # ----------------------------------------

          replace_once(
              "fs/open.c",

              "\tint res;\n"
              "\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n\n"
              "\tif (mode & ~S_IRWXO)",

              "\tint res;\n"
              "\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n\n"
              "#ifdef CONFIG_KSU\n"
              "\textern int ksu_handle_faccessat(int *, const char __user **, int *, int *);\n"
              "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n"
              "#endif\n\n"
              "\tif (mode & ~S_IRWXO)"
          )

          # ----------------------------------------
          # 3. read syscall
          # ----------------------------------------

          read_anchor = (
              "SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\n"
              "{\n"
              "\tstruct fd f = fdget_pos(fd);\n"
              "\tssize_t ret = -EBADF;\n\n"
          )

          read_hook = (
              "#ifdef CONFIG_KSU\n"
              "\textern bool ksu_vfs_read_hook;\n"
              "\textern int ksu_handle_sys_read(unsigned int, char __user **, size_t *);\n"
              "\tif (unlikely(ksu_vfs_read_hook))\n"
              "\t\tksu_handle_sys_read(fd, &buf, &count);\n"
              "#endif\n\n"
          )

          replace_once(
              "fs/read_write.c",
              read_anchor,
              read_anchor + read_hook
          )

          # ----------------------------------------
          # 4. fstat
          # ----------------------------------------

          replace_once(
              "fs/stat.c",

              "\t\t\t\t    request_mask, query_flags);\n"
              "\t\tfdput(f);\n"
              "\t}\n"
              "\treturn error;\n",

              "\t\t\t\t    request_mask, query_flags);\n"
              "\t\tfdput(f);\n"
              "\t}\n"
              "#ifdef CONFIG_KSU\n"
              "\textern void ksu_handle_vfs_fstat(int, loff_t *);\n"
              "\tif (!error)\n"
              "\t\tksu_handle_vfs_fstat(fd, &stat->size);\n"
              "#endif\n"
              "\treturn error;\n"
          )

          # ----------------------------------------
          # 5. stat / newfstatat
          # ----------------------------------------

          stat_anchor = (
              "\tstruct path path;\n"
              "\tint error = -EINVAL;\n"
              "\tunsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;\n\n"
          )

          stat_hook = (
              "#ifdef CONFIG_KSU\n"
              "\textern int ksu_handle_stat(int *, const char __user **, int *);\n"
              "\tksu_handle_stat(&dfd, &filename, &flags);\n"
              "#endif\n\n"
          )

          replace_once(
              "fs/stat.c",
              stat_anchor,
              stat_anchor + stat_hook
          )

          print("All manual hooks applied successfully.")

          PY

          # Validate patch formatting.
          git diff --check

          # Save the applied patch.
          git diff > manual-hooks-applied.patch

          git diff --stat

      # ==========================================
      # 8. Configure kernel
      # ==========================================

      - name: Configure Chopin kernel
        working-directory: kernel
        run: |
          set -euo pipefail

          args=(
            ARCH=arm64
            HOSTCC=gcc
            HOSTCXX=g++
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE="$CROSS_COMPILE"
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32"
          )

          # Load device configuration.
          make O=out "${args[@]}" \
            chopin_user_defconfig \
            2>&1 | tee build.log

          test -s out/.config

          # Configure SukiSU.
          scripts/config --file out/.config \
            --set-str LOCALVERSION "-SukiSU" \
            --enable OVERLAY_FS \
            --enable EXT4_FS \
            --enable KSU \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --disable KSU_SUSFS \
            --disable KPM \
            --disable KSU_FEATURE_ADBROOT \
            --disable KSU_DEBUG

          make O=out "${args[@]}" \
            olddefconfig \
            2>&1 | tee -a build.log

          # Verify required configuration.
          for option in \
            OVERLAY_FS \
            EXT4_FS \
            KSU \
            KALLSYMS \
            KALLSYMS_ALL; do

            grep -qx "CONFIG_${option}=y" out/.config \
              || {
                echo "::error::CONFIG_${option} is not enabled"
                exit 1
              }

          done

          # Verify disabled components.
          for option in \
            KSU_SUSFS \
            KPM \
            KSU_FEATURE_ADBROOT \
            KSU_DEBUG; do

            grep -qx "# CONFIG_${option} is not set" out/.config \
              || {
                echo "::error::CONFIG_${option} is not disabled"
                exit 1
              }

          done

          # Generate compile.h.
          make O=out "${args[@]}" \
            init/version.o \
            2>&1 | tee -a build.log

          test -s out/include/generated/compile.h

      # ==========================================
      # 9. Build SELinux
      # ==========================================

      - name: Build SELinux
        working-directory: kernel
        run: |
          set -euo pipefail

          args=(
            ARCH=arm64
            HOSTCC=gcc
            HOSTCXX=g++
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE="$CROSS_COMPILE"
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32"
          )

          make -j"$(nproc)" O=out "${args[@]}" \
            security/selinux/ \
            2>&1 | tee -a build.log

          test -s out/security/selinux/flask.h

          test -s out/security/selinux/av_permissions.h

      # ==========================================
      # 10. Build SukiSU
      # ==========================================

      - name: Build SukiSU Ultra
        working-directory: kernel
        run: |
          set -euo pipefail

          args=(
            ARCH=arm64
            HOSTCC=gcc
            HOSTCXX=g++
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE="$CROSS_COMPILE"
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32"
          )

          make -j"$(nproc)" O=out "${args[@]}" \
            drivers/kernelsu/ \
            2>&1 | tee -a build.log

      # ==========================================
      # 11. Compile manual hook files
      # ==========================================

      - name: Compile manual hook objects
        working-directory: kernel
        run: |
          set -euo pipefail

          args=(
            ARCH=arm64
            HOSTCC=gcc
            HOSTCXX=g++
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE="$CROSS_COMPILE"
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32"
          )

          make -j"$(nproc)" O=out "${args[@]}" \
            fs/exec.o \
            fs/open.o \
            fs/read_write.o \
            fs/stat.o \
            2>&1 | tee -a build.log

      # ==========================================
      # 12. Full kernel build
      # ==========================================

      - name: Build complete Chopin kernel
        working-directory: kernel
        run: |
          set -euo pipefail

          args=(
            ARCH=arm64
            HOSTCC=gcc
            HOSTCXX=g++
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE="$CROSS_COMPILE"
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32"
          )

          make -j"$(nproc)" O=out "${args[@]}" \
            Image.gz-dtb \
            2>&1 | tee -a build.log

          # Verify KernelSU initialization symbol.
          awk '$3 == "kernelsu_init" {
            found=1
            print
          } END {
            exit !found
          }' out/System.map | tee -a build.log

          # Verify manual hook symbols.
          for symbol in \
            ksu_handle_execveat \
            ksu_handle_faccessat \
            ksu_handle_stat \
            ksu_handle_sys_read \
            ksu_handle_vfs_fstat; do

            awk -v s="$symbol" '
              $3 == s {
                found=1
                print
              }
              END {
                exit !found
              }
            ' out/System.map | tee -a build.log

          done

          # Verify kernel image.
          image=out/arch/arm64/boot/Image.gz-dtb

          test -s "$image"

          echo "=== Kernel image ==="

          ls -lh "$image"

          echo "=== SHA256 ==="

          sha256sum "$image" | tee -a build.log

      # ==========================================
      # 13. Upload kernel image
      # ==========================================

      - name: Upload Chopin SukiSU kernel
        uses: actions/upload-artifact@v4
        with:
          name: chopin-sukisu-kernel-image
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error

      # ==========================================
      # 14. Upload build evidence
      # ==========================================

      - name: Upload build logs and configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chopin-sukisu-build-evidence
          path: |
            kernel/manual-hooks-applied.patch
            kernel/build.log
            kernel/out/.config
            kernel/out/System.map
          include-hidden-files: true
          if-no-files-found: warn
