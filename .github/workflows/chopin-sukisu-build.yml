name: Chopin SukiSU Ultra 4.14

on:
  workflow_dispatch:
  push:
    branches: [chopin-sukisu]
    paths: [.github/workflows/chopin-sukisu-build.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      KERNEL_REV: '0647a49c9557faa92b90c4ae188587787226be9e'
      SUKISU_REV: 'de9bc7e6b46181f8b27ac7b96db946420838dd18'
      CLANG_REV: '6e3223f76384455acde43affde3df0ea9df66c0d'
      GCC64_REV: '961622e926a1b21382dba4dd9fe0e5fb3ee5ab7c'
      GCC32_REV: 'cb7b3ac1b7fdb49474ff68761909934d1142f594'
      SUKISU_VERSION_CODE: '41168'
      SUKISU_VERSION_NAME: 'v4.3.0-r2-de9bc7e6@HEAD'

    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential curl device-tree-compiler flex git \
            libelf-dev libncurses-dev libssl-dev lz4 python3 rsync

      - name: Install pinned Android toolchains
        run: |
          set -euo pipefail
          gitiles=https://android.googlesource.com/platform/prebuilts
          unpack() {
            local url=$1 dest=$2
            mkdir -p "$dest"
            curl --fail --silent --show-error --location --retry 3 \
              --connect-timeout 20 "$url" -o "$dest.tar.gz"
            tar -xzf "$dest.tar.gz" -C "$dest"
            rm -f "$dest.tar.gz"
            printf '%s\n' "$dest/bin" >> "$GITHUB_PATH"
          }

          unpack "$gitiles/clang/host/linux-x86/+archive/$CLANG_REV/clang-r383902.tar.gz" \
            "$RUNNER_TEMP/clang"
          unpack "$gitiles/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/$GCC64_REV.tar.gz" \
            "$RUNNER_TEMP/gcc64"
          unpack "$gitiles/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/$GCC32_REV.tar.gz" \
            "$RUNNER_TEMP/gcc32"

          {
            printf 'LD_LIBRARY_PATH=%s/clang/lib64\n' "$RUNNER_TEMP"
            printf 'CROSS_COMPILE=%s/gcc64/bin/aarch64-linux-android-\n' "$RUNNER_TEMP"
            printf 'CROSS_COMPILE_ARM32=%s/gcc32/bin/arm-linux-androideabi-\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Fetch and verify both source commits
        run: |
          set -euo pipefail
          fetch_commit() {
            local dir=$1 url=$2 rev=$3
            git init -q "$dir"
            git -C "$dir" fetch --depth=1 "$url" "$rev"
            git -C "$dir" checkout --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$rev"
          }

          fetch_commit kernel \
            https://github.com/ChopinKernels/android_kernel_chopin_android_T.git "$KERNEL_REV"
          fetch_commit kernel/KernelSU \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git "$SUKISU_REV"

      - name: Apply the 4.14 compatibility patches and manual hooks
        working-directory: kernel
        run: |
          set -euo pipefail
          test -f include/linux/static_key.h
          sha256sum --check <<'CHECKSUM'
          4e74a6beccf82890c691ff79ad7fac5156e7c164b51ff46f87986f8f0459eeb2  KernelSU/kernel/kernel_includes.h
          CHECKSUM

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          ksu = Path("KernelSU/kernel")

          def replace(path, old, new):
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              path.write_text(source.replace(old, new, 1), encoding="utf-8")

          replace(ksu / "kernel_includes.h", "<linux/static_call.h>", "<linux/static_key.h>")
          replace(ksu / "ksu_main.c", '#include "extension/cpu_spoof.c"\n', "")

          extension = ksu / "extension/extension.c"
          source = extension.read_text(encoding="utf-8")
          handler = re.search(
              r"(?ms)^    static const struct ksu_extension_handler cpu_spoof_handler = "
              r"\{\n.*?^    \};\n", source
          )
          if handler is None:
              raise SystemExit(f"{extension}: CPU spoof handler not found")
          replace(extension, handler[0], "")
          replace(extension,
                  '    if (ksu_register_extension_handler(&cpu_spoof_handler))\n'
                  '        pr_err("extension: failed to register cpu_spoof\\n");\n', "")

          replace(ksu / "preinit/common/preinit.h",
                  "#if !defined(CONFIG_ARM64) || !defined(KSU_CAN_USE_JUMP_LABEL)",
                  "#if !defined(KSU_NO_PREINIT) && "
                  "(!defined(CONFIG_ARM64) || !defined(KSU_CAN_USE_JUMP_LABEL))")
          replace(ksu / "extension/kpm/kpm.c",
                  "access_ok(u64_to_user_ptr(cmd.result_code), sizeof(result))",
                  "access_ok(VERIFY_WRITE, u64_to_user_ptr(cmd.result_code), sizeof(result))")
          for array in ("names", "addrs"):
              replace(ksu / "supercall/dispatch.c",
                      f"kvcalloc(cmd.count, sizeof(*{array}), GFP_KERNEL)",
                      f"kvmalloc_array(cmd.count, sizeof(*{array}), GFP_KERNEL | __GFP_ZERO)")

          makefile = ksu / "Makefile"
          version_block = re.search(
              r"(?ms)^REPO_OWNER  := .*?(?=^\$\(info -- \$\(REPO_NAME\) version:)",
              makefile.read_text(encoding="utf-8")
          )
          if version_block is None:
              raise SystemExit(f"{makefile}: upstream version block not found")
          replace(makefile, version_block[0],
                  "REPO_NAME := SukiSU-Ultra\n"
                  f"KSU_VERSION := {os.environ['SUKISU_VERSION_CODE']}\n"
                  f"KSU_VERSION_FULL := {os.environ['SUKISU_VERSION_NAME']}\n")

          replace(Path("kernel/Makefile"),
                  "$(obj)/config_data.gz: arch/arm64/configs/stock_defconfig FORCE",
                  "$(obj)/config_data.gz: $(KCONFIG_CONFIG) FORCE")

          def insert_hook(path, anchor, declaration, call, *, before=False):
              block = "#ifdef CONFIG_KSU\n" + declaration + call + "#endif\n"
              replace(Path(path), anchor, block + anchor if before else anchor + block)

          exec_check = "\tif (IS_ERR(filename))\n\t\treturn PTR_ERR(filename);\n\n"
          replace(Path("fs/exec.c"), exec_check,
                  "#ifdef CONFIG_KSU\n"
                  "\textern int ksu_handle_execveat(int *, struct filename **, void *, void *, int *);\n"
                  "#endif\n\n" + exec_check +
                  "#ifdef CONFIG_KSU\n"
                  "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
                  "#endif\n")

          access_anchor = "\tint res;\n\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n\n"
          access_validation = "\tif (mode & ~S_IRWXO)"
          replace(Path("fs/open.c"), access_anchor + access_validation,
                  access_anchor +
                  "#ifdef CONFIG_KSU\n"
                  "\textern int ksu_handle_faccessat(int *, const char __user **, int *, int *);\n"
                  "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n"
                  "#endif\n" + access_validation)

          insert_hook(
              "fs/stat.c", "\tstruct path path;\n\tint error = -EINVAL;\n"
              "\tunsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;\n\n",
              "\textern int ksu_handle_stat(int *, const char __user **, int *);\n",
              "\tksu_handle_stat(&dfd, &filename, &flags);\n"
          )

          read_anchor = (
              "\t\tloff_t pos = file_pos_read(f.file);\n"
              "\t\tret = vfs_read(f.file, buf, count, &pos);"
          )
          replace(Path("fs/read_write.c"), read_anchor,
                  "\t\tloff_t pos = file_pos_read(f.file);\n"
                  "#ifdef CONFIG_KSU\n"
                  "\t\textern bool ksu_vfs_read_hook;\n"
                  "\t\textern int ksu_handle_vfs_read(struct file **, char __user **, size_t *, loff_t **);\n"
                  "\t\tif (unlikely(ksu_vfs_read_hook))\n"
                  "\t\t\tksu_handle_vfs_read(&f.file, &buf, &count, NULL);\n"
                  "#endif\n"
                  "\t\tret = vfs_read(f.file, buf, count, &pos);")

          runtime = ksu / "runtime/ksud.c"
          fstat = re.search(r"(?ms)^void ksu_handle_vfs_fstat\(.*?^\}\n",
                            runtime.read_text(encoding="utf-8"))
          if fstat is None:
              raise SystemExit(f"{runtime}: fstat handler not found")
          replace(runtime, fstat[0],
                  "void ksu_handle_vfs_fstat(struct file *file, loff_t *size)\n"
                  "{\n"
                  "    if (ksu_vfs_read_hook && is_init_rc(file))\n"
                  "        *size += ksu_rc_len;\n"
                  "}\n")
          insert_hook(
              "fs/stat.c", "\t\t\t\t    request_mask, query_flags);\n",
              "\t\tif (!error) {\n"
              "\t\t\textern void ksu_handle_vfs_fstat(struct file *, loff_t *);\n",
              "\t\t\tksu_handle_vfs_fstat(f.file, &stat->size);\n\t\t}\n"
          )

          # Route SukiSU requests through its upstream handler. Keep the Linux
          # reboot path and its permission checks intact.
          insert_hook(
              "kernel/reboot.c", "\t/* We only trust the superuser with rebooting the system. */\n",
              "\textern int ksu_handle_sys_reboot(int, int, unsigned int, void __user **);\n",
              "\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n",
              before=True
          )

          for name, line in (
              ("Makefile", 'obj-$(CONFIG_KSU) += kernelsu/'),
              ("Kconfig", 'source "drivers/kernelsu/Kconfig"'),
          ):
              path = Path("drivers") / name
              with path.open("a", encoding="utf-8") as output:
                  output.write("\n" + line + "\n")
          PY

          ln -s ../KernelSU/kernel drivers/kernelsu
          git add -N -- drivers/kernelsu
          git diff --check
          git -C KernelSU diff --check
          git diff --binary > kernel-source.patch
          git -C KernelSU diff --binary > sukisu-source.patch

      - name: Configure, build, and verify Chopin
        working-directory: kernel
        run: |
          set -euo pipefail
          clang --version | tee build.log
          ld.lld --version | tee -a build.log
          test "$("${CROSS_COMPILE}gcc" -dumpmachine)" = aarch64-linux-android
          test "$("${CROSS_COMPILE_ARM32}gcc" -dumpmachine)" = arm-linux-androideabi
          test -x "${CROSS_COMPILE}elfedit"

          kmake() {
            make O=out KCONFIG_CONFIG=.config ARCH=arm64 HOSTCC=gcc HOSTCXX=g++ \
              CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" "$@" \
              2>&1 | tee -a build.log
          }

          kmake chopin_user_defconfig
          scripts/config --file out/.config --set-str LOCALVERSION -SukiSU \
            --enable OVERLAY_FS --enable EXT4_FS --enable KSU \
            --enable KALLSYMS --enable KALLSYMS_ALL \
            --enable IKCONFIG --enable IKCONFIG_PROC --enable PROC_FS \
            --disable KSU_SUSFS --disable KPM --disable KSU_FEATURE_ADBROOT \
            --disable KSU_DEBUG
          kmake olddefconfig

          verify_config() {
            local option
            for option in ARM64 MACH_MT6893 KSU KALLSYMS KALLSYMS_ALL IKCONFIG \
                IKCONFIG_PROC PROC_FS EXT4_FS OVERLAY_FS SECURITY_SELINUX \
                BUILD_ARM64_APPENDED_DTB_IMAGE; do
              grep -Fx "CONFIG_$option=y" "$1"
            done
            grep -Fx 'CONFIG_ARCH_MTK_PROJECT="k6891v1_64"' "$1"
            grep -Fx 'CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES="mediatek/chopin"' "$1"
            grep -Fx 'CONFIG_LOCALVERSION="-SukiSU"' "$1"
            for option in KSU_SUSFS KPM KSU_FEATURE_ADBROOT KSU_DEBUG; do
              grep -Fx "# CONFIG_$option is not set" "$1"
            done
          }
          verify_config out/.config

          jobs=$(nproc)
          kmake init/version.o
          test -s out/include/generated/compile.h
          kmake -j"$jobs" security/selinux/
          test -s out/security/selinux/flask.h
          test -s out/security/selinux/av_permissions.h
          kmake -j"$jobs" Image.gz-dtb

          boot=out/arch/arm64/boot
          dtb="$boot/dts/mediatek/chopin.dtb"
          test "$(fdtget -t s "$dtb" / model)" = CHOPIN
          test "$(fdtget -t s "$dtb" / compatible)" = mediatek,MT6891

          python3 - "$boot" "$dtb" <<'PY'
          import sys
          import zlib
          from pathlib import Path

          boot, dtb = map(Path, sys.argv[1:])
          payload = (boot / "Image.gz").read_bytes()
          raw = (boot / "Image").read_bytes()
          decoder = zlib.decompressobj(wbits=31)
          decoded = decoder.decompress(payload) + decoder.flush()
          if not decoder.eof or decoder.unused_data or decoded != raw:
              raise SystemExit("Image.gz must contain exactly the built Image as one gzip stream")
          if raw[56:60] != b"ARM\x64":
              raise SystemExit("Incorrect ARM64 Image magic")
          if (boot / "Image.gz-dtb").read_bytes() != payload + dtb.read_bytes():
              raise SystemExit("Image.gz-dtb does not contain Image.gz followed by chopin.dtb")
          PY

          gzip -dc out/kernel/config_data.gz > out/config-data.config
          sh scripts/extract-ikconfig "$boot/Image.gz" > out/embedded.config
          cmp out/.config out/config-data.config
          cmp out/.config out/embedded.config
          verify_config out/embedded.config

          # Check caller object references as well as linked definitions.
          check_hook() {
            local object=$1 symbol=$2
            llvm-nm --undefined-only "out/$object" |
              awk -v s="$symbol" '$NF == s { seen=1 } END { exit !seen }'
            awk -v s="$symbol" '$3 == s { seen=1; print } END { exit !seen }' out/System.map
          }
          check_hook fs/exec.o ksu_handle_execveat
          check_hook fs/open.o ksu_handle_faccessat
          check_hook fs/stat.o ksu_handle_stat
          check_hook fs/stat.o ksu_handle_vfs_fstat
          check_hook fs/read_write.o ksu_handle_vfs_read
          check_hook kernel/reboot.o ksu_handle_sys_reboot
          awk '$3 == "kernelsu_init" { seen=1; print } END { exit !seen }' out/System.map

      - name: Stage the kernel payload and build evidence
        working-directory: kernel
        run: |
          set -euo pipefail
          boot=out/arch/arm64/boot
          mkdir -p artifacts/kernel artifacts/evidence
          cp "$boot/Image.gz" artifacts/kernel/
          cp "$boot/Image.gz-dtb" "$boot/dts/mediatek/chopin.dtb" \
            kernel-source.patch sukisu-source.patch build.log out/config-data.config \
            out/embedded.config out/kernel/config_data.gz out/kernel/config_data.h \
            out/System.map out/vmlinux out/include/config/kernel.release artifacts/evidence/
          cp out/.config artifacts/evidence/kernel.config
          if [[ -s out/Module.symvers ]]; then
            cp out/Module.symvers artifacts/evidence/
          fi

          {
            printf 'workflow_revision=%s\nrun_id=%s\nrun_attempt=%s\n' \
              "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'kernel_revision=%s\nsukisu_revision=%s\n' "$KERNEL_REV" "$SUKISU_REV"
            printf 'sukisu_version=%s %s\n' "$SUKISU_VERSION_CODE" "$SUKISU_VERSION_NAME"
            printf 'clang_revision=%s\ngcc64_revision=%s\ngcc32_revision=%s\n' \
              "$CLANG_REV" "$GCC64_REV" "$GCC32_REV"
            printf 'Image.gz: ARM64 gzip kernel payload for the MIUI boot v2 layout.\n'
            printf 'Image.gz-dtb: Image.gz with the Chopin overlay appended, for inspection.\n'
            printf 'MIUI module ABI and device boot have not been verified by this build.\n'
          } > artifacts/kernel/build-manifest.txt

          (
            cd artifacts/kernel
            sha256sum Image.gz > SHA256SUMS
          )
          cp artifacts/kernel/build-manifest.txt artifacts/evidence/
          cp artifacts/kernel/SHA256SUMS artifacts/evidence/PAYLOAD-SHA256SUMS
          (
            cd artifacts/evidence
            sha256sum Image.gz-dtb chopin.dtb kernel.config embedded.config > EVIDENCE-SHA256SUMS
          )

      - name: Upload build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chopin-sukisu-build-evidence-${{ github.run_attempt }}
          path: kernel/artifacts/evidence/
          if-no-files-found: error

      - name: Upload MIUI kernel payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chopin-sukisu-miui-kernel-payload-${{ github.run_attempt }}
          path: kernel/artifacts/kernel/
          if-no-files-found: error
          compression-level: 0

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chopin-sukisu-failed-build-${{ github.run_attempt }}
          path: |
            kernel/build.log
            kernel/kernel-source.patch
            kernel/sukisu-source.patch
            kernel/out/.config
          include-hidden-files: true
          if-no-files-found: ignore
